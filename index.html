<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>给LJY的专属空间✨</title>
    <style>
        /* 1. 整体视觉：淡粉色调 */
        body {
            background-color: #fff0f3;
            color: #555;
            font-family: 'Microsoft YaHei', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* 2. 顶部导航栏 */
        nav {
            width: 100%;
            background-color: #ffb6c1;
            padding: 15px 0;
            display: flex;
            justify-content: center;
            gap: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 1rem;
            transition: opacity 0.3s;
        }

        nav a:hover {
            opacity: 0.8;
        }

        /* 3. 状态栏下方的“生日快乐” */
        .birthday-banner {
            width: 100%;
            background-color: #ffc0cb;
            color: white;
            text-align: center;
            padding: 20px 0;
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 5px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        /* 4. 主要内容容器 */
        .container {
            width: 90%;
            max-width: 600px;
            margin-top: 40px;
            text-align: center;
        }

        header h1 {
            color: #ff8fa3;
            font-size: 2.5rem;
        }

        .profile {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.03);
            margin-bottom: 30px;
        }

        .intro-card {
            border-left: 5px solid #ffb6c1;
            padding: 10px;
            background: #fffafa;
            margin-top: 15px;
            display: inline-block;
        }

        /* 5. 底部文字容器 */
        .footer-container {
            margin-top: auto; /* 推到页面最底部 */
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
            text-align: right;
        }

        footer {
            color: #ff8fa3;
            font-size: 1.2rem;
            font-style: italic;
            padding-right: 20px;
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html">首页</a>
        <a href="share.html">生活分享</a>
        <a href="wish.html">专属祝福</a>
        <a href="message.html">留言板</a>
    </nav>

    <div class="birthday-banner">🎂 生日快乐~ 🎂</div>

    <div class="container">
        <header>
            <h1>halo~主包 🌟</h1>
        </header>
        
        <section class="profile">
            <h2>关于我</h2>
            <p>这里是为主包建立的小站，</p>
            <p>愿你在异国他乡，也能感受到这份温暖。</p>
            <div class="intro-card">
                <p>💡 目前状态：正在努力钻研中...</p>
            </div>
        </section>
    </div>

    <div class="footer-container">
        <footer>From 周</footer>
    </div>

</body>
</html>

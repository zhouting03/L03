<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>专属祝福</title>
    <style>
        /* 1. 页面整体风格：淡粉色 */
        body {
            background-color: #fff0f3; /* 温暖的粉红色背景 */
            margin: 0;
            overflow: hidden; /* 防止出现滚动条 */
            font-family: 'Microsoft YaHei', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
            padding: 16px;
            box-sizing: border-box;
        }

        .home-link {
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 20;
            text-decoration: none;
            color: #ff8fa3;
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid #ffd4dc;
            border-radius: 999px;
            padding: 8px 14px;
            font-size: 0.95rem;
            backdrop-filter: blur(2px);
        }

        .toggle-link {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 20;
            border: 1px solid #ffd4dc;
            border-radius: 999px;
            padding: 8px 14px;
            font-size: 0.95rem;
            color: #ff8fa3;
            background: rgba(255, 255, 255, 0.85);
            cursor: pointer;
            backdrop-filter: blur(2px);
        }

        /* 2. 中央大标题 */
        .main-title {
            font-size: clamp(1.8rem, 5vw, 3rem);
            color: #ff8fa3;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            z-index: 10;
            user-select: none;
            text-align: center;
            max-width: 90vw;
        }

        /* 3. 弹出的祝福语样式 */
        .wish-item {
            position: fixed;
            top: 100vh;
            left: 50%;
            transform: translateX(-50%);
            color: #ff4d6d;
            font-weight: bold;
            font-size: 1.5rem;
            pointer-events: none;
            text-align: center;
            line-height: 1.4;
            max-width: min(80vw, 420px);
            white-space: normal;
            word-break: break-word;
            animation: floatUp 4s linear forwards; /* 向上漂浮动画 */
            opacity: 0;
            z-index: 5;
        }

        /* 4. 漂浮动画定义 */
        @keyframes floatUp {
            0% {
                transform: translateX(-50%) translateY(0) scale(0.8);
                opacity: 0;
            }
            20% {
                opacity: 1;
            }
            80% {
                opacity: 1;
            }
            100% {
                transform: translateX(-50%) translateY(-120vh) scale(1.08);
                opacity: 0;
            }
        }

        @media (max-width: 480px) {
            .home-link {
                top: 12px;
                left: 12px;
                padding: 7px 12px;
                font-size: 0.85rem;
            }

            .toggle-link {
                top: 12px;
                right: 12px;
                padding: 7px 12px;
                font-size: 0.85rem;
            }

            .wish-item {
                max-width: 88vw;
            }
        }
    </style>
</head>
<body>

    <a href="index.html" class="home-link">← 返回主页</a>
    <button id="toggleFlowBtn" class="toggle-link" type="button" aria-pressed="false">暂停漂浮</button>

    <div class="main-title">✨ 给最特别的你 ✨</div>

    <script>
        // 【核心：你可以在这里不断添加祝福语】
        const wishList = [
            "天天开心 ☀️",
            "禁止 Emo 🚫",
            "好运连连 🍀",
            "万事胜意 🌈",
            "学业顺利 🎓",
            "顺风顺水 ⛵",
            "勇敢小鲁，不怕困难 ✨",
            "永远阳光且自由 🕊️",
            "要多笑笑呀 😊"
        ];
        let wishTimer = null;
        let isPaused = false;

        function createWish() {
            const wish = document.createElement('div');
            wish.className = 'wish-item';
            
            // 随机选一条祝福语
            wish.innerText = wishList[Math.floor(Math.random() * wishList.length)];
            
            // 随机字体大小 (1rem - 2.5rem)
            wish.style.fontSize = Math.random() * 1.5 + 1 + "rem";
            
            // 随机动画时长 (让节奏错开)
            wish.style.animationDuration = Math.random() * 3 + 4 + "s";

            document.body.appendChild(wish);

            // 基于元素真实宽度计算水平位置，避免文本超出可视区
            const rect = wish.getBoundingClientRect();
            const margin = 16;
            const minCenter = rect.width / 2 + margin;
            const maxCenter = window.innerWidth - rect.width / 2 - margin;
            let centerX = window.innerWidth / 2;
            if (maxCenter > minCenter) {
                centerX = Math.random() * (maxCenter - minCenter) + minCenter;
            }
            wish.style.left = centerX + "px";

            // 动画结束后自动删除元素，释放内存
            setTimeout(() => {
                wish.remove();
            }, 7000);
        }

        function startWishFlow() {
            if (wishTimer !== null) return;
            wishTimer = setInterval(createWish, 800);
        }

        function stopWishFlow() {
            if (wishTimer === null) return;
            clearInterval(wishTimer);
            wishTimer = null;
        }

        function updateWishFlowState(paused) {
            const btn = document.getElementById('toggleFlowBtn');
            isPaused = paused;

            if (isPaused) {
                stopWishFlow();
                btn.textContent = '继续漂浮';
                btn.setAttribute('aria-pressed', 'true');
            } else {
                startWishFlow();
                btn.textContent = '暂停漂浮';
                btn.setAttribute('aria-pressed', 'false');
            }
        }

        document.getElementById('toggleFlowBtn').addEventListener('click', () => {
            updateWishFlowState(!isPaused);
        });

        // 每隔 800 毫秒弹出一个新祝福
        startWishFlow();
    </script>
</body>
</html>

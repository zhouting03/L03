<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>留言板</title>
    <style>
        body {
            background-color: #fff0f3;
            font-family: 'Microsoft YaHei', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
            color: #555;
        }

        h2 { color: #ff8fa3; margin-top: 20px; }

        .input-container {
            width: 90%;
            max-width: 500px;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }

        /* 发件人选择器样式 */
        .sender-select {
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        select, .custom-input {
            padding: 8px;
            border: 2px solid #ffdae0;
            border-radius: 8px;
            outline: none;
            color: #ff8fa3;
        }

        textarea {
            width: 100%;
            height: 100px;
            border: 2px solid #ffdae0;
            border-radius: 10px;
            padding: 10px;
            box-sizing: border-box;
            resize: none;
            outline: none;
            font-size: 1rem;
        }

        .emoji-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .emoji-btn {
            width: auto;
            margin-top: 0;
            padding: 6px 10px;
            background-color: #ffe4ea;
            color: #ff6f91;
            border-radius: 999px;
            font-size: 1rem;
        }

        .upload-row {
            margin-top: 12px;
            color: #ff8fa3;
            font-size: 0.9rem;
        }

        .upload-row input {
            margin-top: 6px;
        }

        .preview-grid {
            margin-top: 8px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 8px;
        }

        .preview-item {
            position: relative;
        }

        .preview-grid img,
        .msg-images img {
            width: 100%;
            border-radius: 10px;
            border: 1px solid #ffd4dc;
            object-fit: cover;
            aspect-ratio: 1 / 1;
        }

        .preview-remove {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 22px;
            height: 22px;
            margin-top: 0;
            border-radius: 50%;
            padding: 0;
            background: rgba(255, 111, 145, 0.9);
            color: white;
            font-size: 14px;
            line-height: 22px;
            text-align: center;
        }

        .message-content {
            white-space: pre-wrap;
            word-break: break-word;
            margin-bottom: 10px;
        }

        .msg-images {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 8px;
            margin-top: 6px;
        }

        .msg-image-thumb {
            cursor: zoom-in;
        }

        button {
            width: 100%;
            margin-top: 10px;
            background-color: #ff8fa3;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
        }

        .message-item {
            background: white;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            border-left: 5px solid #ffb6c1;
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #ffb6c1;
            margin-bottom: 8px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .delete-btn {
            width: auto;
            margin-top: 0;
            padding: 4px 10px;
            border-radius: 999px;
            background: #ffd7df;
            color: #ff6f91;
            font-size: 0.75rem;
        }

        .preview-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 999;
        }

        .preview-modal.show {
            display: flex;
        }

        .preview-content {
            position: relative;
            max-width: min(90vw, 800px);
            max-height: 85vh;
        }

        .preview-content img {
            width: 100%;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 12px;
            background: white;
        }

        .preview-close {
            position: absolute;
            top: -14px;
            right: -14px;
            width: 34px;
            height: 34px;
            margin-top: 0;
            border-radius: 50%;
            padding: 0;
            font-size: 20px;
            line-height: 34px;
            text-align: center;
            background: #ff8fa3;
        }

        .sender-name { font-weight: bold; color: #ff8fa3; }

        .back-link { margin-top: 20px; text-decoration: none; color: #ff8fa3; }
    </style>
</head>
<body>

    <h2>✉️ 悄悄话留言板</h2>

    <div class="input-container">
        <div class="sender-select">
            <span>来自:</span>
            <select id="senderChoice" onchange="toggleCustomInput()">
                <option value="zt">zt</option>
                <option value="ljy">ljy</option>
                <option value="other">其他(自定义)</option>
            </select>
            <input type="text" id="customSender" class="custom-input" placeholder="输入名字" style="display:none; width: 80px;">
        </div>
        <textarea id="msgInput" placeholder="写下你的留言..."></textarea>
        <div class="emoji-row" id="emojiRow"></div>
        <div class="upload-row">
            <label for="imgInput">添加图片/表情包（可多选）</label><br>
            <input id="imgInput" type="file" accept="image/*" multiple>
            <div id="previewGrid" class="preview-grid"></div>
        </div>
        <button onclick="saveMessage()">发送留言</button>
    </div>

    <div id="message-list"></div>

    <div id="previewModal" class="preview-modal" role="dialog" aria-label="图片预览" aria-modal="true">
        <div class="preview-content">
            <button type="button" class="preview-close" id="previewCloseBtn">×</button>
            <img id="previewImage" alt="预览大图">
        </div>
    </div>

    <a href="index.html" class="back-link">← 返回首页</a>

    <script>
        const emojiPool = ['😀', '😂', '🥳', '❤️', '✨', '👍', '😭', '🔥'];
        let pendingImages = [];

        window.onload = function () {
            initEmojiButtons();
            bindImageInput();
            bindMessageEvents();
            displayMessages();
        };

        function initEmojiButtons() {
            const row = document.getElementById('emojiRow');
            row.innerHTML = emojiPool.map(emoji =>
                `<button class="emoji-btn" type="button" onclick="appendEmoji('${emoji}')">${emoji}</button>`
            ).join('');
        }

        function appendEmoji(emoji) {
            const input = document.getElementById('msgInput');
            input.value += emoji;
            input.focus();
        }

        function bindImageInput() {
            const imgInput = document.getElementById('imgInput');
            const preview = document.getElementById('previewGrid');
            imgInput.addEventListener('change', handleImages);
            preview.addEventListener('click', (event) => {
                const removeBtn = event.target.closest('.preview-remove');
                if (!removeBtn) return;
                const index = Number(removeBtn.dataset.index);
                removePendingImage(index);
            });
        }

        function bindMessageEvents() {
            const list = document.getElementById('message-list');
            const modal = document.getElementById('previewModal');
            const closeBtn = document.getElementById('previewCloseBtn');

            list.addEventListener('click', (event) => {
                const deleteBtn = event.target.closest('.delete-btn');
                if (deleteBtn) {
                    const index = Number(deleteBtn.dataset.index);
                    deleteMessage(index);
                    return;
                }

                const image = event.target.closest('.msg-image-thumb');
                if (image) {
                    openImagePreview(image.dataset.src || '');
                }
            });

            closeBtn.addEventListener('click', closeImagePreview);
            modal.addEventListener('click', (event) => {
                if (event.target === modal) {
                    closeImagePreview();
                }
            });

            document.addEventListener('keydown', (event) => {
                if (event.key === 'Escape') {
                    closeImagePreview();
                }
            });
        }

        function handleImages(event) {
            const files = Array.from(event.target.files || []);
            if (!files.length) return;

            Promise.all(files.map(fileToDataUrl)).then(urls => {
                pendingImages = pendingImages.concat(urls);
                renderPreview();
            }).catch(() => {
                alert('图片读取失败，请重试');
            });
        }

        function fileToDataUrl(file) {
            return new Promise((resolve, reject) => {
                if (!file.type.startsWith('image/')) {
                    reject(new Error('not image'));
                    return;
                }
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function renderPreview() {
            const preview = document.getElementById('previewGrid');
            preview.innerHTML = pendingImages.map((url, index) => `
                <div class="preview-item">
                    <img src="${url}" alt="预览图">
                    <button type="button" class="preview-remove" data-index="${index}" aria-label="移除图片">×</button>
                </div>
            `).join('');
        }

        function removePendingImage(index) {
            if (!Number.isInteger(index) || index < 0 || index >= pendingImages.length) return;
            pendingImages.splice(index, 1);
            renderPreview();
        }

        function toggleCustomInput() {
            const select = document.getElementById('senderChoice');
            const custom = document.getElementById('customSender');
            custom.style.display = select.value === 'other' ? 'inline-block' : 'none';
        }

        function saveMessage() {
            const select = document.getElementById('senderChoice');
            const custom = document.getElementById('customSender');
            const input = document.getElementById('msgInput');
            
            let sender = select.value === 'other' ? custom.value : select.value;
            if (!sender) sender = "匿名";

            if (!input.value.trim() && pendingImages.length === 0) { alert("内容不能为空"); return; }

            const now = new Date();
            const timeString = `${now.getMonth()+1}-${now.getDate()} ${now.getHours()}:${now.getMinutes().toString().padStart(2,'0')}`;

            const newMessage = {
                sender: sender,
                time: timeString,
                text: input.value,
                images: pendingImages
            };
            let messages = JSON.parse(localStorage.getItem('my_messages')) || [];
            messages.unshift(newMessage);
            localStorage.setItem('my_messages', JSON.stringify(messages));
            
            input.value = "";
            custom.value = "";
            pendingImages = [];
            document.getElementById('imgInput').value = '';
            renderPreview();
            displayMessages();
        }

        function escapeHtml(text) {
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function renderImageList(images) {
            if (!Array.isArray(images) || !images.length) return '';
            const safeImages = images
                .filter(url => typeof url === 'string' && url.startsWith('data:image/'))
                .map(url => `<img class="msg-image-thumb" data-src="${url}" src="${url}" alt="留言图片">`)
                .join('');
            if (!safeImages) return '';
            return `<div class="msg-images">${safeImages}</div>`;
        }

        function deleteMessage(index) {
            if (!Number.isInteger(index) || index < 0) return;
            const messages = JSON.parse(localStorage.getItem('my_messages')) || [];
            if (index >= messages.length) return;
            if (!confirm('确定删除这条留言吗？')) return;

            messages.splice(index, 1);
            localStorage.setItem('my_messages', JSON.stringify(messages));
            displayMessages();
        }

        function openImagePreview(src) {
            if (!src || !src.startsWith('data:image/')) return;
            const modal = document.getElementById('previewModal');
            const previewImage = document.getElementById('previewImage');
            previewImage.src = src;
            modal.classList.add('show');
        }

        function closeImagePreview() {
            const modal = document.getElementById('previewModal');
            const previewImage = document.getElementById('previewImage');
            previewImage.removeAttribute('src');
            modal.classList.remove('show');
        }

        function displayMessages() {
            const list = document.getElementById('message-list');
            const messages = JSON.parse(localStorage.getItem('my_messages')) || [];
            list.innerHTML = messages.map((msg, index) => `
                <div class="message-item">
                    <div class="message-header">
                        <span class="sender-name">From: ${escapeHtml(msg.sender || '匿名')}</span>
                        <div class="header-right">
                            <span>${escapeHtml(msg.time || '')}</span>
                            <button class="delete-btn" type="button" data-index="${index}">删除</button>
                        </div>
                    </div>
                    <div class="message-content">${escapeHtml(msg.text || '')}</div>
                    ${renderImageList(msg.images)}
                </div>
            `).join('');
        }
    </script>
</body>
</html>

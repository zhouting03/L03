<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>留言板</title>
    <style>
        body {
            background-color: #fff0f3;
            font-family: 'Microsoft YaHei', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 72px 20px 20px;
            margin: 0;
            color: #555;
        }

        h2 { color: #ff8fa3; margin-top: 0; }

        .input-container {
            width: 90%;
            max-width: 500px;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }

        /* 发件人选择器样式 */
        .sender-select {
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        select, .custom-input {
            padding: 8px;
            border: 2px solid #ffdae0;
            border-radius: 8px;
            outline: none;
            color: #ff8fa3;
        }

        textarea {
            width: 100%;
            height: 100px;
            border: 2px solid #ffdae0;
            border-radius: 10px;
            padding: 10px;
            box-sizing: border-box;
            resize: none;
            outline: none;
            font-size: 1rem;
        }

        .emoji-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .emoji-btn {
            width: auto;
            margin-top: 0;
            padding: 6px 10px;
            background-color: #ffe4ea;
            color: #ff6f91;
            border-radius: 999px;
            font-size: 1rem;
        }

        .upload-row {
            margin-top: 12px;
            color: #ff8fa3;
            font-size: 0.9rem;
        }

        .upload-row input {
            margin-top: 6px;
        }

        .preview-grid {
            margin-top: 8px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 8px;
        }

        .preview-item {
            position: relative;
        }

        .preview-grid img,
        .msg-images img {
            width: 100%;
            border-radius: 10px;
            border: 1px solid #ffd4dc;
            object-fit: cover;
            aspect-ratio: 1 / 1;
        }

        .preview-remove {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 22px;
            height: 22px;
            margin-top: 0;
            border-radius: 50%;
            padding: 0;
            background: rgba(255, 111, 145, 0.9);
            color: white;
            font-size: 14px;
            line-height: 22px;
            text-align: center;
        }

        .message-content {
            white-space: pre-wrap;
            word-break: break-word;
            margin-bottom: 10px;
        }

        .msg-images {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 8px;
            margin-top: 6px;
        }

        .msg-image-thumb {
            cursor: zoom-in;
        }

        button {
            width: 100%;
            margin-top: 10px;
            background-color: #ff8fa3;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
        }

        .message-item {
            background: white;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            border-left: 5px solid #ffb6c1;
            text-align: left;
        }

        .toolbar {
            width: 90%;
            max-width: 500px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            align-self: center;
        }

        #message-list {
            width: 90%;
            max-width: 500px;
            align-self: center;
        }

        .sort-btn {
            width: auto;
            margin-top: 0;
            padding: 6px 10px;
            font-size: 0.8rem;
            background: #ffe4ea;
            color: #ff6f91;
            border-radius: 999px;
        }

        .sort-btn.active {
            background: #ff8fa3;
            color: #fff;
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #ffb6c1;
            margin-bottom: 8px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .action-wrap {
            position: relative;
        }

        .action-btn {
            width: auto;
            margin-top: 0;
            padding: 4px 10px;
            border-radius: 999px;
            background: #ffd7df;
            color: #ff6f91;
            font-size: 0.75rem;
        }

        .action-menu {
            position: absolute;
            right: 0;
            top: calc(100% + 6px);
            min-width: 120px;
            background: #fff;
            border: 1px solid #ffd4dc;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            padding: 6px;
            display: none;
            z-index: 20;
        }

        .action-menu.show {
            display: block;
        }

        .action-item {
            width: 100%;
            margin-top: 0;
            padding: 7px 8px;
            border-radius: 8px;
            font-size: 0.8rem;
            text-align: left;
            background: #fff;
            color: #ff6f91;
        }

        .action-item:hover {
            background: #fff3f6;
        }

        .comments {
            margin-top: 8px;
            border-top: 1px solid #ffe3e8;
            padding-top: 8px;
        }

        .comments-title {
            color: #ff8fa3;
            font-size: 0.82rem;
            margin-bottom: 6px;
        }

        .comment-item {
            background: #fff7f9;
            border-radius: 8px;
            padding: 6px 8px;
            margin-bottom: 6px;
            font-size: 0.85rem;
            color: #666;
        }

        .comment-author {
            color: #ff6f91;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 2px;
        }

        .comment-time {
            color: #ff9caf;
            font-size: 0.75rem;
            margin-bottom: 2px;
        }

        .comment-editor {
            margin-top: 8px;
            display: grid;
            gap: 6px;
            background: linear-gradient(180deg, #fff9fb 0%, #fff4f8 100%);
            border: 1px solid #ffdce4;
            border-radius: 12px;
            padding: 8px;
        }

        .comment-sender-select {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            font-size: 0.85rem;
            color: #ff8fa3;
        }

        .comment-sender-select span {
            color: #ff6f91;
            font-weight: bold;
            background: #ffeaf0;
            border: 1px solid #ffd0da;
            border-radius: 999px;
            padding: 4px 10px;
            line-height: 1;
        }

        .comment-sender-select select,
        .comment-custom-input {
            height: 32px;
            padding: 6px 11px;
            border: 1px solid #ffc9d6;
            border-radius: 999px;
            outline: none;
            color: #ff6f91;
            background: #fff;
            box-shadow: 0 4px 10px rgba(255, 143, 163, 0.12);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .comment-sender-select select {
            min-width: 122px;
            appearance: none;
            padding-right: 28px;
            background-image:
                linear-gradient(45deg, transparent 50%, #ff8fa3 50%),
                linear-gradient(135deg, #ff8fa3 50%, transparent 50%),
                linear-gradient(180deg, #fff 0%, #fff7fa 100%);
            background-position:
                calc(100% - 14px) calc(50% - 2px),
                calc(100% - 9px) calc(50% - 2px),
                0 0;
            background-size: 5px 5px, 5px 5px, 100% 100%;
            background-repeat: no-repeat;
        }

        .comment-custom-input {
            width: 108px;
        }

        .comment-sender-select select:focus,
        .comment-custom-input:focus {
            border-color: #ff9db1;
            box-shadow: 0 0 0 3px rgba(255, 143, 163, 0.18);
        }

        .comment-input {
            width: 100%;
            min-height: 64px;
            border: 1px solid #ffd4dc;
            border-radius: 8px;
            padding: 8px;
            box-sizing: border-box;
            resize: vertical;
            font-size: 0.9rem;
        }

        .comment-actions {
            display: flex;
            gap: 8px;
        }

        .comment-submit,
        .comment-cancel {
            width: auto;
            margin-top: 0;
            padding: 5px 10px;
            border-radius: 999px;
            font-size: 0.78rem;
        }

        .comment-cancel {
            background: #ffe4ea;
            color: #ff6f91;
        }

        .preview-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 999;
        }

        .preview-modal.show {
            display: flex;
        }

        .preview-content {
            position: relative;
            max-width: min(90vw, 800px);
            max-height: 85vh;
        }

        .preview-content img {
            width: 100%;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 12px;
            background: white;
        }

        .preview-close {
            position: absolute;
            top: -14px;
            right: -14px;
            width: 34px;
            height: 34px;
            margin-top: 0;
            border-radius: 50%;
            padding: 0;
            font-size: 20px;
            line-height: 34px;
            text-align: center;
            background: #ff8fa3;
        }

        .sender-name { font-weight: bold; color: #ff8fa3; }

        .extra-links {
            position: fixed;
            top: 16px;
            left: 16px;
            right: 16px;
            display: flex;
            justify-content: space-between;
            gap: 12px;
            z-index: 30;
            pointer-events: none;
        }

        .back-link {
            text-decoration: none;
            color: #ff6f91;
            background: rgba(255, 255, 255, 0.88);
            border: 1px solid #ffd4dc;
            border-radius: 999px;
            padding: 8px 14px;
            box-shadow: 0 8px 18px rgba(255, 111, 145, 0.08);
            pointer-events: auto;
            white-space: nowrap;
        }

        .back-link:hover {
            background: #fff;
        }

        .back-link:first-child {
            align-self: flex-start;
        }

        .back-link:last-child {
            align-self: flex-end;
        }

        @media (max-width: 480px) {
            body {
                padding: 88px 12px 16px;
            }

            .extra-links {
                top: 12px;
                left: 12px;
                right: 12px;
                gap: 10px;
            }

            .back-link {
                padding: 7px 11px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>

    <h2>✉️ 悄悄话留言板</h2>

    <div class="input-container">
        <div class="sender-select">
            <span>来自:</span>
            <select id="senderChoice" onchange="toggleCustomInput()">
                <option value="zt">zt</option>
                <option value="ljy">ljy</option>
                <option value="other">其他(自定义)</option>
            </select>
            <input type="text" id="customSender" class="custom-input" placeholder="输入名字" style="display:none; width: 80px;">
        </div>
        <textarea id="msgInput" placeholder="写下你的留言..."></textarea>
        <div class="emoji-row" id="emojiRow"></div>
        <div class="upload-row">
            <label for="imgInput">添加图片/表情包（可多选）</label><br>
            <input id="imgInput" type="file" accept="image/*" multiple>
            <div id="previewGrid" class="preview-grid"></div>
        </div>
        <button onclick="saveMessage()">发送留言</button>
    </div>

    <div class="toolbar">
        <button type="button" id="sortDescBtn" class="sort-btn active" data-order="desc">时间降序</button>
        <button type="button" id="sortAscBtn" class="sort-btn" data-order="asc">时间升序</button>
    </div>

    <div id="message-list"></div>

    <div id="previewModal" class="preview-modal" role="dialog" aria-label="图片预览" aria-modal="true">
        <div class="preview-content">
            <button type="button" class="preview-close" id="previewCloseBtn">×</button>
            <img id="previewImage" alt="预览大图">
        </div>
    </div>

    <div class="extra-links">
        <a href="index.html" class="back-link">← 返回首页</a>
        <a href="deleted.html" class="back-link">查看最近删除</a>
    </div>

    <script>
        const emojiPool = ['😀', '😂', '🥳', '❤️', '✨', '👍', '😭', '🔥'];
        const MESSAGE_KEY = 'my_messages';
        const DELETED_KEY = 'my_deleted_messages';
        let pendingImages = [];
        let currentSortOrder = 'desc';
        let openActionMenuId = null;
        let openCommentEditorId = null;

        window.onload = function () {
            initEmojiButtons();
            bindImageInput();
            bindMessageEvents();
            bindSortEvents();
            displayMessages();
        };

        function initEmojiButtons() {
            const row = document.getElementById('emojiRow');
            row.innerHTML = emojiPool.map(emoji =>
                `<button class="emoji-btn" type="button" onclick="appendEmoji('${emoji}')">${emoji}</button>`
            ).join('');
        }

        function appendEmoji(emoji) {
            const input = document.getElementById('msgInput');
            input.value += emoji;
            input.focus();
        }

        function bindImageInput() {
            const imgInput = document.getElementById('imgInput');
            const preview = document.getElementById('previewGrid');
            imgInput.addEventListener('change', handleImages);
            preview.addEventListener('click', (event) => {
                const removeBtn = event.target.closest('.preview-remove');
                if (!removeBtn) return;
                const index = Number(removeBtn.dataset.index);
                removePendingImage(index);
            });
        }

        function bindMessageEvents() {
            const list = document.getElementById('message-list');
            const modal = document.getElementById('previewModal');
            const closeBtn = document.getElementById('previewCloseBtn');

            list.addEventListener('click', (event) => {
                event.stopPropagation();

                const actionBtn = event.target.closest('.action-btn');
                if (actionBtn) {
                    const id = String(actionBtn.dataset.id || '');
                    if (!id) return;

                    openActionMenuId = openActionMenuId === id ? null : id;
                    displayMessages();
                    return;
                }

                const actionItem = event.target.closest('.action-item');
                if (actionItem) {
                    const id = String(actionItem.dataset.id || '');
                    const action = String(actionItem.dataset.action || '');
                    openActionMenuId = null;

                    if (action === 'delete') {
                        deleteMessage(id);
                        return;
                    }

                    if (action === 'comment') {
                        openCommentEditorId = id;
                        displayMessages();
                        return;
                    }
                }

                const submitBtn = event.target.closest('.comment-submit');
                if (submitBtn) {
                    const id = String(submitBtn.dataset.id || '');
                    addComment(id);
                    return;
                }

                const cancelBtn = event.target.closest('.comment-cancel');
                if (cancelBtn) {
                    openCommentEditorId = null;
                    displayMessages();
                    return;
                }

                const image = event.target.closest('.msg-image-thumb');
                if (image) {
                    openImagePreview(image.dataset.src || '');
                }
            });

            document.addEventListener('click', (event) => {
                const insideList = event.target.closest('#message-list');
                if (!insideList && openActionMenuId !== null) {
                    openActionMenuId = null;
                    displayMessages();
                }
            });

            closeBtn.addEventListener('click', closeImagePreview);
            modal.addEventListener('click', (event) => {
                if (event.target === modal) {
                    closeImagePreview();
                }
            });

            document.addEventListener('keydown', (event) => {
                if (event.key === 'Escape') {
                    closeImagePreview();
                }
            });
        }

        function bindSortEvents() {
            const sortDescBtn = document.getElementById('sortDescBtn');
            const sortAscBtn = document.getElementById('sortAscBtn');

            sortDescBtn.addEventListener('click', () => {
                currentSortOrder = 'desc';
                updateSortButtons();
                displayMessages();
            });

            sortAscBtn.addEventListener('click', () => {
                currentSortOrder = 'asc';
                updateSortButtons();
                displayMessages();
            });
        }

        function updateSortButtons() {
            const sortDescBtn = document.getElementById('sortDescBtn');
            const sortAscBtn = document.getElementById('sortAscBtn');
            sortDescBtn.classList.toggle('active', currentSortOrder === 'desc');
            sortAscBtn.classList.toggle('active', currentSortOrder === 'asc');
        }

        function handleImages(event) {
            const files = Array.from(event.target.files || []);
            if (!files.length) return;

            Promise.all(files.map(fileToDataUrl)).then(urls => {
                pendingImages = pendingImages.concat(urls);
                renderPreview();
            }).catch(() => {
                alert('图片读取失败，请重试');
            });
        }

        function fileToDataUrl(file) {
            return new Promise((resolve, reject) => {
                if (!file.type.startsWith('image/')) {
                    reject(new Error('not image'));
                    return;
                }
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function renderPreview() {
            const preview = document.getElementById('previewGrid');
            preview.innerHTML = pendingImages.map((url, index) => `
                <div class="preview-item">
                    <img src="${url}" alt="预览图">
                    <button type="button" class="preview-remove" data-index="${index}" aria-label="移除图片">×</button>
                </div>
            `).join('');
        }

        function removePendingImage(index) {
            if (!Number.isInteger(index) || index < 0 || index >= pendingImages.length) return;
            pendingImages.splice(index, 1);
            renderPreview();
        }

        function toggleCustomInput() {
            const select = document.getElementById('senderChoice');
            const custom = document.getElementById('customSender');
            custom.style.display = select.value === 'other' ? 'inline-block' : 'none';
        }

        function saveMessage() {
            const select = document.getElementById('senderChoice');
            const custom = document.getElementById('customSender');
            const input = document.getElementById('msgInput');
            
            let sender = select.value === 'other' ? custom.value : select.value;
            if (!sender) sender = "匿名";

            if (!input.value.trim() && pendingImages.length === 0) { alert("内容不能为空"); return; }

            const createdAt = Date.now();
            const timeString = formatDateTime(createdAt);

            const newMessage = {
                id: generateMessageId(),
                sender: sender,
                time: timeString,
                createdAt: createdAt,
                text: input.value,
                images: pendingImages,
                comments: []
            };
            let messages = getMessages();
            messages.unshift(newMessage);
            saveMessages(messages);
            
            input.value = "";
            custom.value = "";
            pendingImages = [];
            document.getElementById('imgInput').value = '';
            renderPreview();
            displayMessages();
        }

        function escapeHtml(text) {
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function renderImageList(images) {
            if (!Array.isArray(images) || !images.length) return '';
            const safeImages = images
                .filter(url => typeof url === 'string' && url.startsWith('data:image/'))
                .map(url => `<img class="msg-image-thumb" data-src="${url}" src="${url}" alt="留言图片">`)
                .join('');
            if (!safeImages) return '';
            return `<div class="msg-images">${safeImages}</div>`;
        }

        function deleteMessage(id) {
            if (!id) return;
            const messages = getMessages();
            const targetIndex = messages.findIndex(msg => String(msg.id) === String(id));
            if (targetIndex < 0) return;
            if (!confirm('确定删除这条留言吗？')) return;

            const [removedMessage] = messages.splice(targetIndex, 1);
            saveMessages(messages);

            const now = Date.now();

            const deletedMessages = getDeletedMessages();
            deletedMessages.unshift({
                ...removedMessage,
                deletedAt: now
            });
            saveDeletedMessages(deletedMessages);

            if (openCommentEditorId === String(id)) {
                openCommentEditorId = null;
            }

            displayMessages();
        }

        function addComment(messageId) {
            if (!messageId) return;
            const editor = document.querySelector(`.comment-input[data-id="${messageId}"]`);
            if (!editor) return;

            const senderSelect = document.querySelector(`.comment-sender-choice[data-id="${messageId}"]`);
            const customSender = document.querySelector(`.comment-custom-sender[data-id="${messageId}"]`);

            const value = editor.value.trim();
            if (!value) {
                alert('评论内容不能为空');
                return;
            }

            let sender = senderSelect ? senderSelect.value : 'zt';
            if (sender === 'other') {
                sender = customSender ? customSender.value.trim() : '';
            }
            if (!sender) sender = '匿名';

            const messages = getMessages();
            const target = messages.find(msg => String(msg.id) === String(messageId));
            if (!target) return;

            if (!Array.isArray(target.comments)) {
                target.comments = [];
            }

            const createdAt = Date.now();
            target.comments.push({
                id: generateMessageId(),
                sender: sender,
                text: value,
                createdAt: createdAt,
                time: formatDateTime(createdAt)
            });

            saveMessages(messages);
            openCommentEditorId = null;
            displayMessages();
        }

        function generateMessageId() {
            return `${Date.now()}_${Math.random().toString(16).slice(2, 8)}`;
        }

        function formatDateTime(timestamp) {
            const date = new Date(timestamp);
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const hour = String(date.getHours()).padStart(2, '0');
            const minute = String(date.getMinutes()).padStart(2, '0');
            return `${year}-${month}-${day} ${hour}:${minute}`;
        }

        function getMessages() {
            const raw = JSON.parse(localStorage.getItem(MESSAGE_KEY)) || [];
            let changed = false;
            const base = Date.now();

            const normalized = raw.map((msg, index) => {
                const normalizedMsg = { ...msg };

                if (!normalizedMsg.id) {
                    normalizedMsg.id = `${base - index}_${Math.random().toString(16).slice(2, 8)}`;
                    changed = true;
                }

                if (typeof normalizedMsg.createdAt !== 'number' || Number.isNaN(normalizedMsg.createdAt)) {
                    normalizedMsg.createdAt = base - index;
                    changed = true;
                }

                if (typeof normalizedMsg.time !== 'string' || !/^\d{4}-\d{2}-\d{2}\s\d{2}:\d{2}$/.test(normalizedMsg.time)) {
                    normalizedMsg.time = formatDateTime(normalizedMsg.createdAt);
                    changed = true;
                }

                if (!Array.isArray(normalizedMsg.comments)) {
                    normalizedMsg.comments = [];
                    changed = true;
                }

                const normalizedComments = normalizedMsg.comments.map((comment, commentIndex) => {
                    const normalizedComment = { ...comment };
                    const fallbackTime = normalizedMsg.createdAt + commentIndex;

                    if (!normalizedComment.id) {
                        normalizedComment.id = `${normalizedMsg.id}_c_${commentIndex}`;
                        changed = true;
                    }

                    if (typeof normalizedComment.createdAt !== 'number' || Number.isNaN(normalizedComment.createdAt)) {
                        normalizedComment.createdAt = fallbackTime;
                        changed = true;
                    }

                    if (typeof normalizedComment.time !== 'string' || !/^\d{4}-\d{2}-\d{2}\s\d{2}:\d{2}$/.test(normalizedComment.time)) {
                        normalizedComment.time = formatDateTime(normalizedComment.createdAt);
                        changed = true;
                    }

                    if (typeof normalizedComment.sender !== 'string' || !normalizedComment.sender.trim()) {
                        normalizedComment.sender = '匿名';
                        changed = true;
                    }

                    return normalizedComment;
                });

                normalizedMsg.comments = normalizedComments;

                return normalizedMsg;
            });

            if (changed) {
                saveMessages(normalized);
            }

            return normalized;
        }

        function saveMessages(messages) {
            localStorage.setItem(MESSAGE_KEY, JSON.stringify(messages));
        }

        function getDeletedMessages() {
            return JSON.parse(localStorage.getItem(DELETED_KEY)) || [];
        }

        function saveDeletedMessages(messages) {
            localStorage.setItem(DELETED_KEY, JSON.stringify(messages));
        }

        function openImagePreview(src) {
            if (!src || !src.startsWith('data:image/')) return;
            const modal = document.getElementById('previewModal');
            const previewImage = document.getElementById('previewImage');
            previewImage.src = src;
            modal.classList.add('show');
        }

        function closeImagePreview() {
            const modal = document.getElementById('previewModal');
            const previewImage = document.getElementById('previewImage');
            previewImage.removeAttribute('src');
            modal.classList.remove('show');
        }

        function renderComments(comments) {
            if (!Array.isArray(comments) || comments.length === 0) return '';
            const safeComments = comments.map((comment) => `
                <div class="comment-item">
                    <div class="comment-author">来自：${escapeHtml(comment.sender || '匿名')}</div>
                    <div class="comment-time">${escapeHtml(comment.time || '')}</div>
                    <div>${escapeHtml(comment.text || '')}</div>
                </div>
            `).join('');
            return `<div class="comments"><div class="comments-title">评论</div>${safeComments}</div>`;
        }

        function toggleCommentCustomInput(messageId) {
            const select = document.querySelector(`.comment-sender-choice[data-id="${messageId}"]`);
            const custom = document.querySelector(`.comment-custom-sender[data-id="${messageId}"]`);
            if (!select || !custom) return;
            custom.style.display = select.value === 'other' ? 'inline-block' : 'none';
            if (select.value !== 'other') {
                custom.value = '';
            }
        }

        function renderCommentEditor(messageId) {
            if (String(openCommentEditorId) !== String(messageId)) return '';
            return `
                <div class="comment-editor">
                    <div class="comment-sender-select">
                        <span>来自:</span>
                        <select class="comment-sender-choice" data-id="${escapeHtml(String(messageId))}" onchange="toggleCommentCustomInput('${escapeHtml(String(messageId))}')">
                            <option value="zt">zt</option>
                            <option value="ljy">ljy</option>
                            <option value="other">其他(自定义)</option>
                        </select>
                        <input type="text" class="comment-custom-input comment-custom-sender" data-id="${escapeHtml(String(messageId))}" placeholder="输入名字" style="display:none;">
                    </div>
                    <textarea class="comment-input" data-id="${escapeHtml(String(messageId))}" placeholder="写下你对这条留言的评论..."></textarea>
                    <div class="comment-actions">
                        <button type="button" class="comment-submit" data-id="${escapeHtml(String(messageId))}">提交评论</button>
                        <button type="button" class="comment-cancel" data-id="${escapeHtml(String(messageId))}">取消</button>
                    </div>
                </div>
            `;
        }

        function displayMessages() {
            const list = document.getElementById('message-list');
            const messages = getMessages();
            const sortedMessages = [...messages].sort((a, b) => {
                return currentSortOrder === 'asc'
                    ? a.createdAt - b.createdAt
                    : b.createdAt - a.createdAt;
            });

            list.innerHTML = sortedMessages.map((msg) => `
                <div class="message-item">
                    <div class="message-header">
                        <span class="sender-name">From: ${escapeHtml(msg.sender || '匿名')}</span>
                        <div class="header-right">
                            <span>${escapeHtml(msg.time || '')}</span>
                            <div class="action-wrap">
                                <button class="action-btn" type="button" data-id="${escapeHtml(String(msg.id || ''))}">操作</button>
                                <div class="action-menu ${openActionMenuId === String(msg.id) ? 'show' : ''}">
                                    <button class="action-item" type="button" data-action="comment" data-id="${escapeHtml(String(msg.id || ''))}">评论该留言</button>
                                    <button class="action-item" type="button" data-action="delete" data-id="${escapeHtml(String(msg.id || ''))}">删除该留言</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="message-content">${escapeHtml(msg.text || '')}</div>
                    ${renderImageList(msg.images)}
                    ${renderComments(msg.comments)}
                    ${renderCommentEditor(msg.id)}
                </div>
            `).join('');
        }
    </script>
</body>
</html>

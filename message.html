<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>留言板</title>
    <style>
        body {
            background-color: #fff0f3;
            font-family: 'Microsoft YaHei', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
            color: #555;
        }

        h2 { color: #ff8fa3; margin-top: 20px; }

        .input-container {
            width: 90%;
            max-width: 500px;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }

        /* 发件人选择器样式 */
        .sender-select {
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        select, .custom-input {
            padding: 8px;
            border: 2px solid #ffdae0;
            border-radius: 8px;
            outline: none;
            color: #ff8fa3;
        }

        textarea {
            width: 100%;
            height: 100px;
            border: 2px solid #ffdae0;
            border-radius: 10px;
            padding: 10px;
            box-sizing: border-box;
            resize: none;
            outline: none;
            font-size: 1rem;
        }

        button {
            width: 100%;
            margin-top: 10px;
            background-color: #ff8fa3;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
        }

        .message-item {
            background: white;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            border-left: 5px solid #ffb6c1;
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #ffb6c1;
            margin-bottom: 8px;
        }

        .sender-name { font-weight: bold; color: #ff8fa3; }

        .back-link { margin-top: 20px; text-decoration: none; color: #ff8fa3; }
    </style>
</head>
<body>

    <h2>✉️ 悄悄话留言板</h2>

    <div class="input-container">
        <div class="sender-select">
            <span>来自:</span>
            <select id="senderChoice" onchange="toggleCustomInput()">
                <option value="zt">zt</option>
                <option value="ljy">ljy</option>
                <option value="other">其他(自定义)</option>
            </select>
            <input type="text" id="customSender" class="custom-input" placeholder="输入名字" style="display:none; width: 80px;">
        </div>
        <textarea id="msgInput" placeholder="写下你的留言..."></textarea>
        <button onclick="saveMessage()">发送留言</button>
    </div>

    <div id="message-list"></div>

    <a href="index.html" class="back-link">← 返回首页</a>

    <script>
        window.onload = displayMessages;

        function toggleCustomInput() {
            const select = document.getElementById('senderChoice');
            const custom = document.getElementById('customSender');
            custom.style.display = select.value === 'other' ? 'inline-block' : 'none';
        }

        function saveMessage() {
            const select = document.getElementById('senderChoice');
            const custom = document.getElementById('customSender');
            const input = document.getElementById('msgInput');
            
            let sender = select.value === 'other' ? custom.value : select.value;
            if (!sender) sender = "匿名";

            if (!input.value.trim()) { alert("内容不能为空"); return; }

            const now = new Date();
            const timeString = `${now.getMonth()+1}-${now.getDate()} ${now.getHours()}:${now.getMinutes().toString().padStart(2,'0')}`;

            const newMessage = { sender: sender, time: timeString, text: input.value };
            let messages = JSON.parse(localStorage.getItem('my_messages')) || [];
            messages.unshift(newMessage);
            localStorage.setItem('my_messages', JSON.stringify(messages));
            
            input.value = "";
            custom.value = "";
            displayMessages();
        }

        function displayMessages() {
            const list = document.getElementById('message-list');
            const messages = JSON.parse(localStorage.getItem('my_messages')) || [];
            list.innerHTML = messages.map(msg => `
                <div class="message-item">
                    <div class="message-header">
                        <span class="sender-name">From: ${msg.sender}</span>
                        <span>${msg.time}</span>
                    </div>
                    <div class="message-content">${msg.text}</div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
